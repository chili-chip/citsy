name: Tests

# Build the citsy library and examples, then run the Catch2 unit tests in tests/unit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCITSY_BUILD_TESTS=ON -DCITSY_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The browser player (citsy.wasm) that the Chili creator ships, built with
  # Emscripten and run in Node. The built files are kept as an artifact so the
  # creator can take them from a tested run.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.10"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build citsy.wasm
        run: |
          emcmake cmake -S . -B build-web -DCITSY_BUILD_WEB=ON -DCITSY_BUILD_TESTS=OFF \
            -DCITSY_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --target citsy_web --parallel

      - name: Test citsy.wasm in Node
        run: node --test tests/web/*.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: citsy-web
          path: |
            build-web/citsy.js
            build-web/citsy.wasm

  # The parity goldens come from the Bitsy 8.15 reference engine; fail when a
  # case or game changed and its golden was not written again.
  parity-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check goldens against Bitsy 8.15
        run: node tests/parity/bitsy_reference.mjs --check

  # Line coverage of src/ and include/, for information only: the target is 80%
  # (AGENTS.md), and a lower number never fails this job or blocks the PR.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TARGET: "80"
    steps:
      - uses: actions/checkout@v7

      - name: Build with coverage
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DCITSY_BUILD_TESTS=ON -DCITSY_BUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage
          cmake --build build-cov --parallel

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      - name: Report coverage (target 80%, information only)
        if: always()
        run: |
          # Catch2 is built in build-cov/_deps with the same flags; skip its
          # data files, whose sources gcov cannot find.
          if ! pipx run gcovr==7.2 --root . --filter 'src/' --filter 'include/' --object-directory build-cov \
            --gcov-exclude-directories '.*/_deps(/.*)?$' --gcov-ignore-errors=no_working_dir_found \
            --json-summary coverage.json --txt coverage.txt; then
            echo "::warning title=Code coverage::gcovr could not build the report. Information only, not blocking."
            exit 0
          fi
          total=$(python3 -c "import json; print(round(json.load(open('coverage.json'))['line_percent'], 1))")
          {
            echo "## Code coverage: ${total}% of lines (target ${TARGET}%)"
            echo
            echo "Information only: this check never blocks a pull request."
            echo
            echo "<details><summary>Per file</summary>"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if python3 -c "import sys; sys.exit(0 if float('$total') >= float('$TARGET') else 1)"; then
            echo "::notice title=Code coverage::${total}% of lines (target ${TARGET}%)"
          else
            echo "::warning title=Code coverage below target::${total}% of lines, target ${TARGET}%. Information only, not blocking."
          fi
